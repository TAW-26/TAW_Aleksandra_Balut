<div class="activity-item">
  <app-activity-item-image [category]="event()?.category"
                           [altText]="event()?.title || 'Zdjęcie wydarzenia'">
  </app-activity-item-image>

  <div class="content">
    <app-activity-item-text [title]="event()?.title ?? ''"
                            [description]="event()?.description ?? ''"
                            [date]="event()?.date ?? ''">
    </app-activity-item-text>

    <div class="footer-row">
      <div class="details">
        <i class="fa fa-users"></i>
        Uczestnicy: <strong>{{ event()?.participants?.length || 0 }}</strong> / {{ event()?.maxParticipants }}
      </div>

      @if (!isOwner()) {
      <div class="actions">
        @if (isLoggedIn()) {
        <i class="fa heart-icon"
           [ngClass]="{ 'fa-heart': isLiked(), 'fa-heart-o': !isLiked() }"
           (click)="toggleLike($event)">
        </i>

        <button class="join-btn"
                [class.joined]="isJoined()"
                (click)="isJoined() ? leave($event) : join($event)">
          {{ isJoined() ? 'Wypisz się' : 'Zapisz się' }}
        </button>
        }
      </div>
      }
    </div>
  </div>
</div>
